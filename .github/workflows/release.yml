name: Release

# Push a tag like v0.2.0 to build signed APKs (one per CPU type plus a universal one) and
# attach them to a GitHub release, where Sine's "Check for updates" finds them.
#
# Repository secrets:
#   SINE_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   SINE_KEYSTORE_PASSWORD
#   SINE_KEY_ALIAS
#   SINE_KEY_PASSWORD
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore
        env:
          KEYSTORE: ${{ secrets.SINE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::SINE_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > release.jks
      - name: Test
        run: ./gradlew :app:testReleaseUnitTest
      - name: Build APKs
        env:
          SINE_KEYSTORE_FILE: release.jks
          SINE_KEYSTORE_PASSWORD: ${{ secrets.SINE_KEYSTORE_PASSWORD }}
          SINE_KEY_ALIAS: ${{ secrets.SINE_KEY_ALIAS }}
          SINE_KEY_PASSWORD: ${{ secrets.SINE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PsineVersion=${GITHUB_REF_NAME}
      - name: Rename
        run: |
          mkdir out
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$f" "out/Sine-${GITHUB_REF_NAME}-${abi}.apk"
          done
          ls -la out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.apk --title "Sine ${GITHUB_REF_NAME#v}" --generate-notes
